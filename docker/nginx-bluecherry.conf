server {
  listen 7001 ssl;
  index index.php;
  server_name _;
  root       /usr/share/bluecherry/www;

  error_log  /var/log/nginx/bluecherry-error.log;
  access_log /var/log/nginx/bluecherry-access.log;

  include /usr/share/bluecherry/nginx-includes/snakeoil.conf;
  include /usr/share/bluecherry/nginx-includes/php-generic.conf;

  location /.well-known/ {
      try_files $uri $uri/ =404;
  }

  location / {
      try_files $uri $uri/ /index.php$is_args$args;
  }

  # Ao vivo (HLS) do bc-server. Só as duas rotas que o app e o painel usam
  # (playlist e segmento .ts) e query sem aspas/percent: o que chega ao
  # servidor HLS por aqui não precisa de login no nginx, então nada além
  # disso passa. Mesma guarda aplicada em produção em 2026-11-09 (porta 7000,
  # no nginx-app.conf montado por volume).
  location /hls {
      if ($uri !~ "^/hls/[0-9]+/[0-9]+/(playlist\.m3u8|[0-9]+/payload\.ts)$") { return 403; }
      if ($args !~ "^[A-Za-z0-9=&._:-]*$") { return 403; }
      proxy_pass http://127.0.0.1:7003;
  }

  location /api {
      proxy_pass http://127.0.0.1:7005;
  }
}
